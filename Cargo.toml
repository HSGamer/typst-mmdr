[package]
name = "typst-mmdr"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
mermaid-rs-renderer = { git = "https://github.com/HSGamer/mermaid-rs-renderer", branch = "next", default-features = false }
wasm-minimal-protocol = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
json_value_merge = "2.0.1"
